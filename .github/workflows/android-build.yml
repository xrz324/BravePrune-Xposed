name: CI and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests and lint
        run: >-
          ./gradlew --no-daemon
          testDebugUnitTest
          lintDebug

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build release APK
        run: >-
          ./gradlew --no-daemon
          testDebugUnitTest
          lintDebug
          assembleRelease

      - name: Prepare release assets
        shell: bash
        run: |
          asset="BravePrune-${GITHUB_REF_NAME}.apk"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/${asset}"
          cd release
          sha256sum "${asset}" > "${asset}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release/*
          --verify-tag
          --generate-notes
          --title "BravePrune ${GITHUB_REF_NAME}"
